<body>
<section id="pairing">
  <div class="pair-shell">
    <div class="pair-hero">
      <div class="brand-row"><div class="brand-mark" aria-hidden="true"></div><div class="brand-copy"><div class="brand-name">DSH Remote</div><div class="eyebrow">Private relay</div></div></div>
      <h1>把电脑上的工作，带到手机继续。</h1>
      <p>粘贴电脑生成的 DR2 配对码。消息在离开设备前加密，中继服务只会看到密文。</p>
    </div>
    <div class="pair-card">
      <label class="field-label" for="pair-code">配对码</label>
      <div class="pair-input-wrap"><textarea id="pair-code" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="粘贴 DR2. 开头的配对码"></textarea></div>
      <div id="pair-status" role="status" aria-live="polite"></div>
      <div class="pair-buttons"><button id="pair" class="primary">验证并连接</button><button id="clear-pair">清空</button></div>
    </div>
    <div class="privacy"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="4" y="10" width="16" height="11" rx="3"/></svg><span>DR2 包含远程控制权限。只保存在当前浏览器或 App 中，不要公开分享。</span></div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="top-line">
      <div class="brand-row"><div class="brand-mark" aria-hidden="true"></div><div class="brand-copy"><div class="brand-name">DSH Remote</div><div class="eyebrow">Agent console</div></div></div>
      <div class="connection-pill" id="connection-pill" data-level="warn"><span class="status-dot"></span><div id="connection" role="status" aria-live="polite">准备同步…</div></div>
    </div>
    <div id="host">等待电脑回应…</div>
    <button id="usage-trigger" class="usage-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="查看余额与峰谷用量"><svg viewBox="0 0 24 14" width="22" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 7c4 0 3-4 7-4s3 8 7 8 4-4 6-4"/></svg><strong id="usage-balance">余额 —</strong><span id="usage-preview" class="usage-preview">等待电脑同步用量</span><span class="usage-arrow" aria-hidden="true">›</span></button>
    <div class="session-row">
      <button id="session-trigger" class="session-trigger" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="session-trigger-copy"><span id="session-trigger-title" class="session-trigger-title">正在载入会话…</span><span id="session-trigger-meta" class="session-trigger-meta">点击选择或搜索</span></span>
        <svg class="session-chevron" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <button id="refresh" class="icon-button" type="button" title="立即同步" aria-label="立即同步" aria-busy="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 0-2.34 5.66"/></svg></button>
      <button id="repair" class="icon-button" title="重新配对" aria-label="重新配对"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 7V3m6 4V3M7 9h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V9Z"/><path d="M12 17v4"/></svg></button>
    </div>
    <div class="actions">
      <button data-cmd="/status">状态</button>
      <button data-cmd="/sessions">会话</button>
      <button data-cmd="/pending">待处理</button>
      <button data-cmd="/queue">队列</button>
      <button id="stop" class="bad">停止</button>
    </div>
  </header>
  <main id="messages"><div class="empty-state" id="empty-state"><div class="empty-orb"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.6A2.5 2.5 0 0 1 4 13.5v-8Z"/></svg></div><strong>已准备好接收消息</strong><span>电脑完成工作后，回复会安全地出现在这里。</span></div></main>
  <footer id="composer">
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="给 Agent 发送消息…"></textarea>
      <button id="send" class="primary" title="发送" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-5 14-2-5-7-2Z"/><path d="m12 14 7-9"/></svg></button>
    </div>
    <div id="mode">
      <label><input id="steer" type="checkbox"><span>实时干预</span></label>
      <span id="sync-hint"></span>
    </div>
  </footer>
</section>

<div id="session-modal" class="session-modal" hidden>
  <section class="session-sheet" role="dialog" aria-modal="true" aria-labelledby="session-sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <div><div id="session-sheet-title" class="sheet-title">选择会话</div><div id="session-count" class="sheet-subtitle">等待电脑返回会话</div></div>
      <button id="session-close" class="sheet-close" type="button" aria-label="关闭">×</button>
    </header>
    <div class="session-search-wrap"><input id="session-search" class="session-search" type="search" autocomplete="off" placeholder="搜索标题或 ID…" aria-label="搜索会话"></div>
    <div id="session-list" class="session-list" role="listbox" aria-label="会话列表"></div>
    <footer class="sheet-footer"><button id="session-new" type="button">＋ 新建对话</button></footer>
  </section>
</div>

<div id="confirm-modal" class="session-modal" hidden>
  <section class="session-sheet confirm-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="confirm-copy"><h2 id="confirm-title">确认操作</h2><p id="confirm-text"></p></div>
    <div class="confirm-actions"><button id="confirm-cancel" type="button">取消</button><button id="confirm-accept" class="danger" type="button">确认</button></div>
  </section>
</div>

<div id="usage-modal" class="session-modal" hidden>
  <section class="session-sheet usage-sheet" role="dialog" aria-modal="true" aria-labelledby="usage-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head"><div><div id="usage-title" class="sheet-title">用量与余额</div><div class="sheet-subtitle">与电脑端使用同一数据源</div></div><button id="usage-close" class="sheet-close" type="button" aria-label="关闭用量面板">×</button></header>
    <div class="usage-body">
      <div class="usage-hero"><div class="usage-label">DeepSeek 账户余额</div><div id="usage-total-balance" class="usage-number">—</div><div id="usage-status" class="usage-status" role="status"></div></div>
      <div class="usage-card">
      <div class="usage-detail-row"><span>当前时段</span><span id="usage-period" class="usage-period"><svg class="pwave" viewBox="0 0 24 14" width="20" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 7c4 0 3-4 7-4s3 8 7 8 4-4 6-4"/></svg><span id="usage-period-text">—</span></span></div>
      <div class="usage-detail-row"><span>最近活跃会话 · 估算费用</span><span id="usage-cost">—</span></div>
      <div class="usage-detail-row"><span>峰时 / 谷时费用</span><span id="usage-buckets">—</span></div>
      <div class="usage-detail-row"><span>总 Tokens</span><span id="usage-tokens">—</span></div>
      </div>
      <div id="usage-schedule" class="usage-foot"></div><div id="usage-source" class="usage-foot"></div><div id="usage-sampled" class="usage-foot"></div>
    </div>
    <footer class="sheet-footer"><button id="usage-refresh" type="button">刷新用量</button></footer>
  </section>
</div>

<script src="./markdown.js"></script>
<script src="./connection.js"></script>
<script src="./usage.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id),te=new TextEncoder(),td=new TextDecoder();
const MAX_AGE=30*24*60*60*1000,FUTURE_SKEW=5*60*1000,PAIR_KEY="dr-pairing-v2";
const B64=/^[A-Za-z0-9_-]+$/,CURSOR=/^(?:0-0|[1-9][0-9]*-[0-9]+)$/;let pairing=null,pollTimer=null,failures=0;
let sessions=[],muted=false,state=null,sessionModalTimer=null,lastSessionFocus=null,confirmResolve=null;
let session=null,connectionTimer=null,newConversationPending=false;
const connection=new DRConnection.ConnectionState();
const usage=new DRUsage.UsageState();let usageModalTimer=null;
function renderUsage(){const v=usage.view(),d=v.d;$("usage-balance").textContent="余额 "+v.balance;$("usage-preview").textContent=v.stale?v.status:d?`${v.periodLabel} · 估算 ${v.cost}`:v.status;$("usage-trigger").dataset.period=v.period||"";$("usage-trigger").dataset.stale=String(v.stale);const balEl=$("usage-total-balance");if(balEl.textContent!==v.balance){balEl.textContent=v.balance;balEl.classList.remove("num-pop");void balEl.offsetWidth;balEl.classList.add("num-pop")}$("usage-status").textContent=v.status;$("usage-period-text").textContent=v.periodLabel;$("usage-period").dataset.period=v.period||"";$("usage-cost").textContent=v.cost;$("usage-buckets").textContent=d?`${DRUsage.money(d.peak?.cost,d.costCurrency,4)} / ${DRUsage.money(d.offpeak?.cost,d.costCurrency,4)}`:"—";$("usage-tokens").textContent=Number.isFinite(d?.totalTokens)?d.totalTokens.toLocaleString("zh-CN"):"—";$("usage-schedule").textContent=v.range;$("usage-source").textContent=d?`统计电脑最近活跃会话，不一定是手机所选对话。${d.sessionId?" ID "+d.sessionId.slice(-8)+"。":""}\n${d.model||"未知模型"} · 按电脑端价目估算${d.pricingDate?"（"+d.pricingDate+"）":""}，以服务商账单为准。`:"由电脑端读取余额；API 密钥不会发送到手机或中继。";$("usage-sampled").textContent="采样："+v.sampled;$("usage-refresh").disabled=v.busy;$("usage-refresh").textContent=v.busy?"正在同步…":"刷新用量"}
async function requestUsage(force=false){const ctx=session;if(!ctx||document.hidden||!connection.relay||!usage.due(force))return;const env=envelope("usage",{});usage.request(env.id);renderUsage();try{const wire=await seal(env,"to-pc",ctx);await postItem({id:env.id,wire},ctx)}catch{if(session===ctx){usage.fail(env.id);renderUsage()}}}
function openUsage(){clearTimeout(usageModalTimer);$("usage-modal").hidden=false;$("usage-trigger").setAttribute("aria-expanded","true");renderUsage();requestAnimationFrame(()=>{$("usage-modal").classList.add("open");$("usage-close").focus()});void requestUsage()}
function closeUsage(){const modal=$("usage-modal");if(modal.hidden)return;modal.classList.remove("open");$("usage-trigger").setAttribute("aria-expanded","false");clearTimeout(usageModalTimer);usageModalTimer=setTimeout(()=>{modal.hidden=true;$("usage-trigger").focus()},240)}
function assertSession(ctx){if(!ctx||session!==ctx||ctx.abort.signal.aborted)throw Object.assign(new Error("连接已切换"),{stale:true})}
function disconnect(){clearTimeout(pollTimer);clearInterval(connectionTimer);session?.abort.abort();session=null;pairing=null;sessions=[];connection.reset();usage.reset();closeUsage();setRefreshing(false)}
function setRefreshing(busy){$("refresh").disabled=busy;$("refresh").setAttribute("aria-busy",String(busy));$("refresh").setAttribute("aria-label",busy?"正在同步":"立即同步")}
async function refreshRemote(){const ctx=session;if(!ctx||ctx.refreshing)return;ctx.refreshing=true;setRefreshing(true);try{await pullOnce();assertSession(ctx);await push("hello",{});await requestUsage(true)}catch(err){if(session===ctx&&!err.stale)renderNotice({level:"error",text:"刷新失败: "+err.message})}finally{ctx.refreshing=false;if(session===ctx)setRefreshing(false)}}
function renderConnection(){const status=connection.view();setConnection(status.text,status.level);renderUsage()}
function storageGet(key){try{return localStorage.getItem(key)}catch{return null}}
function storageSet(key,value){try{localStorage.setItem(key,value);return true}catch{return false}}
function storageRemove(key){try{localStorage.removeItem(key)}catch{}}
function rand(n){const b=new Uint8Array(n);crypto.getRandomValues(b);return b}
function b64url(bytes){let s="";for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function unb64url(value){const s=value.replace(/-/g,"+").replace(/_/g,"/");const pad=s.length%4?"=".repeat(4-s.length%4):"";const bin=atob(s+pad),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function normalizePairingCode(value){const compact=String(value||"").replace(/[\s\u200B-\u200D\u2060\uFEFF]/g,"");const match=compact.match(/DR[12]\.[A-Za-z0-9_-]+/i);return match?match[0].replace(/^dr/i,"DR"):compact}
function parsePairing(code){
  code=normalizePairingCode(code);if(code.startsWith("DR1."))throw new Error("旧版 DR1 配对码不能用于 Vercel 中继");if(!code.startsWith("DR2."))throw new Error("没有识别到有效的 DR2 配对码");
  let raw;try{raw=JSON.parse(td.decode(unb64url(code.slice(4))))}catch{throw new Error("配对码解码失败")}
  if(!raw||typeof raw.u!=="string"||typeof raw.c!=="string"||typeof raw.a!=="string"||typeof raw.k!=="string")throw new Error("配对码字段缺失");
  const url=new URL(raw.u);if(url.username||url.password||url.search||url.hash)throw new Error("中继地址不能包含账号、查询参数或片段");if(url.protocol!=="https:"&&!(url.protocol==="http:"&&["localhost","127.0.0.1","[::1]"].includes(url.hostname)))throw new Error("中继必须使用 HTTPS");
  if(!B64.test(raw.c)||raw.c.length<16||raw.c.length>64||!B64.test(raw.a)||!B64.test(raw.k)||unb64url(raw.a).length!==32||unb64url(raw.k).length!==32)throw new Error("配对码密钥格式错误");
  return{url:url.toString().replace(/\/$/,""),channel:raw.c,authToken:raw.a,key:raw.k};
}
function stateKey(){return"dr-state-v3:"+encodeURIComponent(pairing.url)+":"+pairing.channel}
function freshState(){return{cursorToPhone:"0-0",uiLog:[],outbox:[],currentSessionId:null}}
function loadState(){let raw=storageGet(stateKey());const legacy="dr-state-v2:"+pairing.channel,owner=legacy+":owner";if(!raw&&(!storageGet(owner)||storageGet(owner)===pairing.url)){raw=storageGet(legacy);if(raw&&!storageSet(owner,pairing.url))raw=null}try{state=JSON.parse(raw)||freshState()}catch{state=freshState()}if(!state||typeof state!=="object"||Array.isArray(state))state=freshState();if(!Array.isArray(state.uiLog))state.uiLog=[];if(!Array.isArray(state.outbox))state.outbox=[];state.uiLog=state.uiLog.filter(x=>x&&typeof x.type==="string"&&x.data&&typeof x.data==="object").slice(-300);state.outbox=state.outbox.filter(x=>x&&typeof x.id==="string"&&B64.test(x.id)&&x.id.length>=16&&x.id.length<=64&&typeof x.wire==="string"&&x.wire.length<=80*1024&&x.wire.startsWith(`v2.${x.id}.`)).slice(-200);if(typeof state.cursorToPhone!=="string"||!CURSOR.test(state.cursorToPhone))state.cursorToPhone="0-0";if(typeof state.currentSessionId!=="string")state.currentSessionId=null}
function cursorAfter(candidate,previous){if(!CURSOR.test(candidate)||!CURSOR.test(previous))return false;const [ct,cs]=candidate.split("-").map(BigInt),[pt,ps]=previous.split("-").map(BigInt);return ct>pt||(ct===pt&&cs>ps)}
function updateSyncHint(){if(!state)return;const queued=state.outbox.length;$("sync-hint").textContent=queued?`待发送 ${queued} 条`:muted?"电脑端已静音":"端到端加密"}
function saveState(){if(!state||!pairing)return false;state.uiLog=state.uiLog.slice(-300);let value=JSON.stringify(state);while(value.length>1500000&&state.uiLog.length>40){state.uiLog=state.uiLog.slice(20);value=JSON.stringify(state)}let saved=storageSet(stateKey(),value);if(!saved){state.uiLog=state.uiLog.slice(-60);saved=storageSet(stateKey(),JSON.stringify(state))}updateSyncHint();if(!saved)$("sync-hint").textContent="本地存储不可用，请勿关闭应用";return saved}
async function deriveKey(direction,ctx=session){
  assertSession(ctx);if(ctx.keys.has(direction))return ctx.keys.get(direction);const master=unb64url(ctx.pairing.key),salt=te.encode("dsh-remote:"+ctx.pairing.channel),info=te.encode("dsh-remote/v2:"+direction);
  const base=await crypto.subtle.importKey("raw",master,"HKDF",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt,info},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);assertSession(ctx);ctx.keys.set(direction,key);return key;
}
function aad(direction,id,ctx=session){return te.encode(`dsh-remote/v2|${ctx.pairing.channel}|${direction}|${id}`)}
function envelope(kind,data,ref){const env={v:2,id:b64url(rand(16)),k:kind,ts:Date.now(),d:data};if(ref!==undefined&&ref!==null)env.r=ref;return env}
async function seal(env,direction,ctx=session){const iv=rand(12),key=await deriveKey(direction,ctx),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:aad(direction,env.id,ctx),tagLength:128},key,te.encode(JSON.stringify(env)));assertSession(ctx);return`v2.${env.id}.${b64url(iv)}.${b64url(new Uint8Array(ct))}`}
async function openWire(wire,direction,ctx=session){
  if(typeof wire!=="string")return null;const p=wire.split(".");if(p.length!==4||p[0]!=="v2"||!B64.test(p[1]))return null;
  try{const id=p[1],iv=unb64url(p[2]),blob=unb64url(p[3]);if(iv.length!==12||blob.length<17||b64url(iv)!==p[2]||b64url(blob)!==p[3])return null;const key=await deriveKey(direction,ctx),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv,additionalData:aad(direction,id,ctx),tagLength:128},key,blob),env=JSON.parse(td.decode(pt)),age=Date.now()-env.ts;assertSession(ctx);if(env?.v!==2||env.id!==id||typeof env.k!=="string"||!Number.isFinite(env.ts)||age>MAX_AGE||age<-FUTURE_SKEW)return null;return env}catch{return null}
}
