plugins {
    id 'com.android.application'
}

android {
    namespace 'com.poesis.dshremote'
    compileSdk 35

    defaultConfig {
        applicationId "com.poesis.dshremote"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "0.8.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
