name: Check suite
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build:pwa
      - run: npm run check
      - run: npm run audit:public
  novatab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/novatab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/novatab/package-lock.json
      - run: npm ci
      - run: npm exec wxt prepare
      - run: npm run compile
      - run: npm run build
